<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Sin conexión — Orgrow</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: #0b0d12; color: #eef1f8;
        font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 360px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 20px 0 8px; font-size: 22px; }
      p { margin: 0 0 24px; color: #a3abbd; line-height: 1.5; }
      button {
        font: inherit; font-weight: 600; color: #fff; background: #3b7cec;
        border: 0; border-radius: 10px; padding: 11px 22px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>No hemos podido cargar Orgrow y todavía no está guardada en este dispositivo. Conéctate una vez y después funcionará aunque no tengas red.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>

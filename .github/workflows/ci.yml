name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Dependencias con vulnerabilidades conocidas
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      # Falla si aparece una clave, un .env o un correo personal en lo versionado.
      - name: Auditoría del repositorio
        run: node scripts/audit-repo.mjs --files-only
